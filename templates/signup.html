<!DOCTYPE html>

<html>

<head>

    <title>Create Account</title>

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

</head>


<body>

    <div class="form-page">

        <div class="form-card">

            <h1>Create Account</h1>

            <p class="subtitle">
                Create your private Job Tracker dashboard.
            </p>


            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    <div class="flash-container">

                        {% for category, message in messages %}

                            <div class="flash-message flash-{{ category }}">
                                {{ message }}
                            </div>

                        {% endfor %}

                    </div>

                {% endif %}

            {% endwith %}


            <form method="POST">


                <div class="form-group">

                    <label>Email</label>

                    <input
                        type="email"
                        name="email"
                        required
                        autocomplete="email"
                    >

                </div>


                <div class="form-group">

                    <label>Password</label>

                    <input
                        type="password"
                        name="password"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >

                </div>


                <div class="form-group">

                    <label>Confirm Password</label>

                    <input
                        type="password"
                        name="confirm_password"
                        required
                        minlength="8"
                        autocomplete="new-password"
                    >

                </div>


                <button type="submit">
                    Create Account
                </button>


            </form>


            <p class="auth-switch">

                Already have an account?

                <a href="{{ url_for('login') }}">
                    Log In
                </a>

            </p>

        </div>

    </div>

</body>

</html>
