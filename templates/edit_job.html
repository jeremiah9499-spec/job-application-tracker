<!DOCTYPE html>

<html>
<head>
    <title>Edit Application</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>

<body>

    <div class="form-page">

        <div class="form-card">

            <h1>Edit Job Application</h1>

            <p class="subtitle">
                Update the details for this application.
            </p>

            <form method="POST">

                <div class="form-group">
                    <label>Company Name</label>

                    <input
                        type="text"
                        name="company_name"
                        value="{{ application[1] }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Job Title</label>

                    <input
                        type="text"
                        name="job_title"
                        value="{{ application[2] }}"
                        required
                    >
                </div>

                <div class="form-group">
                    <label>Status</label>

                    <select name="status">

                        <option
                            value="Applied"
                            {% if application[3] == "Applied" %}selected{% endif %}
                        >
                            Applied
                        </option>

                        <option
                            value="Interview"
                            {% if application[3] == "Interview" %}selected{% endif %}
                        >
                            Interview
                        </option>

                        <option
                            value="Offered"
                            {% if application[3] == "Offered" %}selected{% endif %}
                        >
                            Offered
                        </option>

                        <option
                            value="Rejected"
                            {% if application[3] == "Rejected" %}selected{% endif %}
                        >
                            Rejected
                        </option>

                    </select>
                </div>

                <div class="form-group">
                    <label>Date Applied</label>

                    <input
                        type="date"
                        name="date_applied"
                        value="{{ application[4] }}"
                        required
                    >
                </div>

                <div class="form-actions">

                    <a
                        href="{{ url_for('home') }}"
                        class="btn cancel-btn"
                    >
                        Cancel
                    </a>

                    <button type="submit">
                        Save Changes
                    </button>

                </div>

            </form>

        </div>

    </div>

</body>
</html>
