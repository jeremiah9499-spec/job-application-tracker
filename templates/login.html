<!DOCTYPE html>

<html>

<head>

    <title>Log In | NextStride</title>

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1"
    >

    <link
        rel="stylesheet"
        href="{{ url_for('static', filename='style.css') }}"
    >

    <link
        rel="icon"
        type="image/png"
        href="{{ url_for('static', filename='nextstride-icon.png') }}"
    >

</head>


<body>

    <div class="form-page">

        <div class="form-card">


            <!-- =========================
                 CLICKABLE NEXTSTRIDE LOGO
            ========================== -->

            <a
                href="{{ url_for('landing') }}"
                class="auth-brand-logo"
                aria-label="Return to NextStride home"
            >

                <img
                    src="{{ url_for('static', filename='nextstride-logo.png') }}"
                    alt="NextStride - Your career. Your next move."
                >

            </a>


            <!-- =========================
                 LOGIN HEADING
            ========================== -->

            <h1>
                Welcome Back
            </h1>

            <p class="subtitle">
                Log in to continue your NextStride.
            </p>


            <!-- =========================
                 FLASH MESSAGES
            ========================== -->

            {% with messages = get_flashed_messages(with_categories=true) %}

                {% if messages %}

                    <div class="flash-container">

                        {% for category, message in messages %}

                            <div class="flash-message flash-{{ category }}">
                                {{ message }}
                            </div>

                        {% endfor %}

                    </div>

                {% endif %}

            {% endwith %}


            <!-- =========================
                 LOGIN FORM
            ========================== -->

            <form method="POST">


                <div class="form-group">

                    <label>
                        Email
                    </label>

                    <input
                        type="email"
                        name="email"
                        placeholder="you@example.com"
                        required
                        autocomplete="email"
                    >

                </div>


                <div class="form-group">

                    <label>
                        Password
                    </label>

                    <input
                        type="password"
                        name="password"
                        placeholder="Enter your password"
                        required
                        autocomplete="current-password"
                    >

                </div>


                <button
                    type="submit"
                    class="auth-submit-btn"
                >
                    Log In →
                </button>


            </form>


            <!-- =========================
                 SIGN UP LINK
            ========================== -->

            <p class="auth-switch">

                Don't have an account?

                <a href="{{ url_for('signup') }}">
                    Create Account
                </a>

            </p>


            <!-- =========================
                 BACK TO LANDING PAGE
            ========================== -->

            <a
                href="{{ url_for('landing') }}"
                class="auth-back-home"
            >
                ← Back to NextStride
            </a>


        </div>

    </div>

</body>

</html>
